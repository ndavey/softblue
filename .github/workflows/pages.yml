name: Deploy PWA to GitHub Pages

# Publishes the static front-end (softblue/static) to GitHub Pages on every
# push that touches it. Pages serves it over HTTPS at a stable URL
# (https://<user>.github.io/<repo>/), which is what the offline PWA / service
# worker needs — all asset paths are relative so the sub-path works.

on:
  push:
    branches: [main]
    paths:
      - "softblue/static/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: softblue/static
      - id: deployment
        uses: actions/deploy-pages@v4
