[project]
name = "softblue"
version = "1.0.0"
description = "MF bluebox tone generator for telecom CTF prep (PhreakMe / ProjectMF lab)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "shelldon" }]
dependencies = [
    "numpy>=1.24",
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cli = ["rich>=13.0"]
tui = ["textual>=0.50", "rich>=13.0"]
web = ["fastapi>=0.100", "uvicorn>=0.23", "websockets>=11.0", "jinja2>=3.1"]
audio = ["sounddevice>=0.4"]
all = ["softblue[cli,tui,web,audio]"]
dev = ["pytest>=7.0", "softblue[all]"]

[project.scripts]
softblue = "softblue.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["softblue"]

[tool.hatch.build.targets.wheel.force-include]
"softblue/static" = "softblue/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
